<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: 50px auto;
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            text-align: center;
            color: #222;
        }

        p.aciklama {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .input-alani {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        #mesaj {
            flex: 1;
            padding: 14px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 10px;
            outline: none;
        }

        #mesaj:focus {
            border-color: #4a90e2;
        }

        button {
            padding: 14px 20px;
            font-size: 16px;
            border: none;
            border-radius: 10px;
            background: #4a90e2;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #357bd8;
        }

        .sohbet-kutusu {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 16px;
            min-height: 150px;
            max-height: 400px;
            overflow-y: auto;
            line-height: 1.5;
            color: #222;
        }

        .etiket {
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }

        .uyari {
            color: #c62828;
            margin-bottom: 12px;
            display: none;
        }

        .yukleniyor {
            color: #666;
            display: none;
            margin-bottom: 12px;
        }

        .mesaj {
            margin-bottom: 12px;
            padding: 10px 12px;
            border-radius: 10px;
        }

        .kullanici {
            background: #e3f2fd;
        }

        .ai {
            background: #f1f8e9;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>AI Chatbot</h1>
        <p class="aciklama">Mesajını yaz, yapay zeka sana cevap versin.</p>

        <div class="uyari" id="uyari">Lütfen önce bir mesaj yaz.</div>
        <div class="yukleniyor" id="yukleniyor">Yanıt hazırlanıyor...</div>

        <div class="input-alani">
            <input type="text" id="mesaj" placeholder="Buraya mesajını yaz">
            <button id="gonderButonu" onclick="gonder()">Gönder</button>
            <button onclick="sohbetiTemizle()">Temizle</button>
        </div>

        <div class="etiket">Sohbet:</div>
        <div class="sohbet-kutusu" id="sohbet">
            <div class="mesaj ai">Henüz bir mesaj yok.</div>
        </div>
    </div>

    <script>
        const mesajInput = document.getElementById("mesaj");

        mesajInput.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                gonder();
            }
        });

        async function gonder() {
            const mesajKutusu = document.getElementById("mesaj");
            const sohbetAlani = document.getElementById("sohbet");
            const uyari = document.getElementById("uyari");
            const yukleniyor = document.getElementById("yukleniyor");
            const gonderButonu = document.getElementById("gonderButonu");

            const mesaj = mesajKutusu.value.trim();

            if (mesaj === "") {
                uyari.style.display = "block";
                return;
            }

            uyari.style.display = "none";
            yukleniyor.style.display = "block";
            gonderButonu.disabled = true;

            if (sohbetAlani.innerText.includes("Henüz bir mesaj yok.")) {
                sohbetAlani.innerHTML = "";
            }

            sohbetAlani.innerHTML += `<div class="mesaj kullanici"><b>Sen:</b> ${mesaj}</div>`;
            mesajKutusu.value = "";

            try {
                const response = await fetch("http://127.0.0.1:8000/chat", {
                    method: "POST",
                    headers: {
                         "Content-Type": "application/json",
                          "x-api-key": "asli_gizli_anahtar_123"
                    },
                    body: JSON.stringify({
                        message: mesaj
                    })
                });

                const data = await response.json();

                sohbetAlani.innerHTML += `<div class="mesaj ai"><b>AI:</b> ${data.cevap}</div>`;
                sohbetAlani.scrollTop = sohbetAlani.scrollHeight;
            } catch (error) {
                sohbetAlani.innerHTML += `<div class="mesaj ai"><b>Hata:</b> API çalışıyor mu kontrol et.</div>`;
                console.error("Hata:", error);
            } finally {
                yukleniyor.style.display = "none";
                gonderButonu.disabled = false;
            }
        }

        function sohbetiTemizle() {
            const sohbetAlani = document.getElementById("sohbet");
            sohbetAlani.innerHTML = '<div class="mesaj ai">Henüz bir mesaj yok.</div>';
        }
    </script>

</body>
</html>
