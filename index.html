<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Son Dakika Haberleri | Yapay Zeka Haber</title>

<meta name="description" content="Yapay zeka ile üretilen son dakika, teknoloji, spor ve ekonomi haberleri. Hızlı ve güncel.">

<style>
body {
    margin:0;
    font-family: Arial;
    background:#f5f5f5;
}

/* HEADER */
header {
    background:#c00;
    color:white;
    padding:15px;
    font-size:22px;
    text-align:center;
}

/* MENU */
.menu {
    background:#222;
    display:flex;
    overflow-x:auto;
}
.menu button {
    flex:1;
    padding:12px;
    border:none;
    background:#222;
    color:white;
    cursor:pointer;
}
.menu button:hover {
    background:#c00;
}

/* MANŞET */
.headline {
    background:white;
    margin:15px;
    padding:15px;
    border-radius:10px;
    font-weight:bold;
    font-size:18px;
}

/* NEWS LIST */
.news {
    margin:15px;
}

.news-item {
    background:white;
    margin-bottom:10px;
    padding:10px;
    border-radius:8px;
    display:flex;
    justify-content:space-between;
    font-size:14px;
}

.time {
    color:gray;
}

/* INPUT */
.input-box {
    position:fixed;
    bottom:0;
    width:100%;
    display:flex;
}

input {
    flex:1;
    padding:12px;
    border:none;
}

button.send {
    padding:12px;
    border:none;
    background:#c00;
    color:white;
}
</style>
</head>

<body>

<header>📰 AI SON DAKİKA</header>

<div class="menu">
    <button onclick="getNews('son dakika haberleri')">Son Dakika</button>
    <button onclick="getNews('güncel haberler')">Güncel</button>
    <button onclick="getNews('dünya haberleri')">Dünya</button>
    <button onclick="getNews('ekonomi haberleri')">Ekonomi</button>
    <button onclick="getNews('spor haberleri')">Spor</button>
</div>

<div class="headline" id="headline">
Yükleniyor...
</div>

<div class="news" id="news"></div>

<div class="input-box">
    <input id="input" placeholder="Haber sor...">
    <button class="send" onclick="send()">Gönder</button>
</div>

<script>
const API_URL = "https://ai-chatbot-api-bj93.onrender.com/chat";

/* saat */
function getTime(){
    const d = new Date();
    return d.getHours() + ":" + String(d.getMinutes()).padStart(2,'0');
}

/* haber ekle */
function addNews(text){
    const div = document.createElement("div");
    div.className="news-item";
    div.innerHTML = "<span>"+text+"</span><span class='time'>"+getTime()+"</span>";
    document.getElementById("news").prepend(div);
}

/* manşet */
function setHeadline(text){
    document.getElementById("headline").innerText = text;
}

/* API çağrısı */
async function getNews(query){

    // 🔥 URL paylaşılabilir hale gelir
    window.history.pushState({}, "", "?q=" + encodeURIComponent(query));

    const res = await fetch(API_URL,{
        method:"POST",
        headers:{ "Content-Type":"application/json"},
        body: JSON.stringify({message:query})
    });

    const data = await res.json();

    setHeadline(data.cevap);
    addNews(data.cevap);
}

/* inputtan gönder */
async function send(){
    const input = document.getElementById("input");
    const text = input.value;
    if(!text) return;

    input.value="";

    const res = await fetch(API_URL,{
        method:"POST",
        headers:{ "Content-Type":"application/json"},
        body: JSON.stringify({message:text})
    });

    const data = await res.json();

    setHeadline(data.cevap);
    addNews(data.cevap);
}

/* sayfa açılınca */
window.onload = function () {

    // 🔥 URL’den query çek
    const params = new URLSearchParams(window.location.search);
    const q = params.get("q");

    if(q){
        getNews(q);
    } else {
        // 🔥 otomatik haber
        getNews("son dakika haberleri");
    }
};
</script>

</body>
</html>
