<!DOCTYPE html>
<html>
<head>
    <title>AI Haber Merkezi</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
            margin: 0;
        }

        header {
            background: #111;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 22px;
        }

        .container {
            max-width: 800px;
            margin: 20px auto;
        }

        .search-box {
            display: flex;
            margin-bottom: 20px;
        }

        .search-box input {
            flex: 1;
            padding: 12px;
            border: none;
            outline: none;
            border-radius: 5px 0 0 5px;
        }

        .search-box button {
            padding: 12px;
            border: none;
            background: #4caf50;
            color: white;
            cursor: pointer;
            border-radius: 0 5px 5px 0;
        }

        .news-card {
            background: white;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 10px;
            box-shadow: 0px 0px 5px #ccc;
        }

        .loading {
            text-align: center;
            font-style: italic;
            color: gray;
        }
    </style>
</head>

<body>

<header>
📰 AI Haber Merkezi
</header>

<div class="container">

    <div class="search-box">
        <input id="input" placeholder="Haber sor (örn: teknoloji gündemi)" onkeypress="handle(event)">
        <button onclick="send()">Ara</button>
    </div>

    <div id="news"></div>

</div>

<script>
const API_URL = "https://ai-chatbot-api-bj93.onrender.com/chat";

// Haber kartı ekleme
function addNews(text) {
    const div = document.createElement("div");
    div.classList.add("news-card");
    div.innerText = text;
    document.getElementById("news").prepend(div);

    // localStorage kaydet
    let news = JSON.parse(localStorage.getItem("news")) || [];
    news.push(text);
    localStorage.setItem("news", JSON.stringify(news));
}

// Sayfa açılınca eski haberleri yükle
window.onload = function () {
    let news = JSON.parse(localStorage.getItem("news")) || [];

    news.forEach(n => {
        const div = document.createElement("div");
        div.classList.add("news-card");
        div.innerText = n;
        document.getElementById("news").appendChild(div);
    });
};

async function send() {
    const input = document.getElementById("input");
    const text = input.value;
    if (!text) return;

    input.value = "";

    // loading
    const loading = document.createElement("div");
    loading.classList.add("loading");
    loading.innerText = "Haber hazırlanıyor...";
    document.getElementById("news").prepend(loading);

    try {
        const res = await fetch(API_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ message: text })
        });

        const data = await res.json();

        loading.remove();
        addNews(data.cevap);

    } catch (error) {
        loading.remove();
        addNews("Hata oluştu 😢");
    }
}

function handle(e) {
    if (e.key === "Enter") send();
}
</script>

</body>
</html>
