<!DOCTYPE html>
<html>
<head>
    <title>AI Chatbot</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            margin-top: 40px;
        }

        .chat-container {
            width: 400px;
            background: white;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            height: 500px;
            overflow: hidden;
            box-shadow: 0px 0px 10px #ccc;
        }

        .messages {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
        }

        .msg {
            padding: 8px;
            margin: 5px;
            border-radius: 10px;
            max-width: 70%;
        }

        .user {
            background: #dcf8c6;
            align-self: flex-end;
        }

        .bot {
            background: #eee;
            align-self: flex-start;
        }

        .input-box {
            display: flex;
            border-top: 1px solid #ddd;
        }

        input {
            flex: 1;
            padding: 10px;
            border: none;
            outline: none;
        }

        button {
            padding: 10px;
            border: none;
            background: #4caf50;
            color: white;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="chat-container">
    <div class="messages" id="chat"></div>

    <div class="input-box">
        <input id="input" placeholder="Mesaj yaz..." onkeypress="handle(event)">
        <button onclick="send()">Gönder</button>
    </div>
</div>

<script>
const API_URL = "https://ai-chatbot-api-bj93.onrender.com/chat";

function addMessage(text, type) {
    const div = document.createElement("div");
    div.classList.add("msg", type);
    div.innerText = text;
    document.getElementById("chat").appendChild(div);
}

async function send() {
    const input = document.getElementById("input");
    const text = input.value;
    if (!text) return;

    addMessage(text, "user");
    input.value = "";

    // 👇 "Yazıyor..." mesajı
    const typingDiv = document.createElement("div");
    typingDiv.classList.add("msg", "bot");
    typingDiv.innerText = "Yazıyor...";
    document.getElementById("chat").appendChild(typingDiv);

    try {
        const res = await fetch(API_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ message: text })
        });

        const data = await res.json();

        // 👇 typing mesajını kaldır
        typingDiv.remove();

        // 👇 gerçek cevap
        addMessage(data.cevap, "bot");

    } catch (error) {
        typingDiv.remove();
        addMessage("Bir hata oluştu 😢", "bot");
    }
}

function handle(e) {
    if (e.key === "Enter") send();
}
</script>

</body>
</html>
