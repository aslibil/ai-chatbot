<!DOCTYPE html>
<html>
<head>
    <title>AI Haber Merkezi</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #0f172a;
            color: white;
        }

        header {
            background: #020617;
            padding: 15px;
            text-align: center;
            font-size: 22px;
            border-bottom: 1px solid #1e293b;
        }

        .container {
            max-width: 900px;
            margin: 20px auto;
            padding: 10px;
        }

        .search-box {
            display: flex;
            margin-bottom: 15px;
        }

        .search-box input {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px 0 0 6px;
            outline: none;
        }

        .search-box button {
            padding: 12px;
            border: none;
            background: #22c55e;
            color: white;
            cursor: pointer;
            border-radius: 0 6px 6px 0;
        }

        .categories {
            margin-bottom: 15px;
        }

        .categories button {
            margin: 5px;
            padding: 8px 12px;
            border: none;
            background: #1e293b;
            color: white;
            border-radius: 6px;
            cursor: pointer;
        }

        .categories button:hover {
            background: #22c55e;
        }

        .news-card {
            background: #1e293b;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 10px;
            box-shadow: 0 0 5px rgba(0,0,0,0.3);
        }

        .loading {
            text-align: center;
            color: gray;
        }
    </style>
</head>

<body>

<header>
📰 AI Haber Merkezi
</header>

<div class="container">

    <div class="search-box">
        <input id="input" placeholder="Haber sor..." onkeypress="handle(event)">
        <button onclick="send()">Ara</button>
    </div>

    <div class="categories">
        <button onclick="quickNews('teknoloji haberleri')">Teknoloji</button>
        <button onclick="quickNews('spor haberleri')">Spor</button>
        <button onclick="quickNews('ekonomi haberleri')">Ekonomi</button>
        <button onclick="quickNews('dünya haberleri')">Dünya</button>
    </div>

    <div id="news"></div>

</div>

<script>
const API_URL = "https://ai-chatbot-api-bj93.onrender.com/chat";

function addNews(text) {
    const div = document.createElement("div");
    div.classList.add("news-card");
    div.innerText = text;
    document.getElementById("news").prepend(div);
}

function quickNews(text) {
    document.getElementById("input").value = text;
    send();
}

async function send() {
    const input = document.getElementById("input");
    const text = input.value;
    if (!text) return;

    input.value = "";

    const loading = document.createElement("div");
    loading.classList.add("loading");
    loading.innerText = "Yükleniyor...";
    document.getElementById("news").prepend(loading);

    try {
        const res = await fetch(API_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ message: text })
        });

        const data = await res.json();

        loading.remove();
        addNews(data.cevap);

    } catch (err) {
        loading.remove();
        addNews("Hata oluştu");
    }
}

function handle(e) {
    if (e.key === "Enter") send();
}
</script>

</body>
</html>
