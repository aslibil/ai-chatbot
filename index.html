<!DOCTYPE html>
<html>
<head>

<meta name="google-site-verification" content="vRFuZ3zfWbqTKkobPSu5bda4XsVANqwHo7mpQefhLaU" />
<meta name="robots" content="index, follow">
<meta name="description" content="PrimeHaber - Son dakika haberleri, ekonomi, spor ve dünya haberleri.">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Son Dakika Haberleri | PrimeHaber</title>

<style>
body {
    margin:0;
    font-family: Arial;
    background:#f5f5f5;
}

header {
    background:#111;
    color:white;
    padding:15px;
    font-size:22px;
    text-align:center;
}

.menu {
    background:#222;
    display:flex;
    overflow-x:auto;
}

.menu button {
    flex:1;
    padding:12px;
    border:none;
    background:#222;
    color:white;
    cursor:pointer;
}

.menu button:hover {
    background:#c00;
}

.ad-box {
    margin:15px;
    background:white;
    padding:15px;
    text-align:center;
    border-radius:10px;
    color:gray;
}

.headline {
    background:white;
    margin:15px;
    padding:15px;
    border-radius:10px;
    font-weight:bold;
    font-size:18px;
}

.news {
    margin:15px;
}

.news-item {
    background:white;
    margin-bottom:10px;
    padding:10px;
    border-radius:8px;
    display:flex;
    justify-content:space-between;
    font-size:14px;
}

.time {
    color:gray;
}

.input-box {
    position:fixed;
    bottom:0;
    width:100%;
    display:flex;
}

input {
    flex:1;
    padding:12px;
    border:none;
}

button.send {
    padding:12px;
    border:none;
    background:#c00;
    color:white;
}
</style>

</head>

<body>

<header>📰 PrimeHaber | Gerçek Zamanlı Haber Akışı</header>

<div class="menu">
    <button onclick="getNews('son dakika haberleri')">Son Dakika</button>
    <button onclick="getNews('güncel haberler')">Güncel</button>
    <button onclick="getNews('dünya haberleri')">Dünya</button>
    <button onclick="getNews('ekonomi haberleri')">Ekonomi</button>
    <button onclick="getNews('spor haberleri')">Spor</button>
</div>

<div class="ad-box">
    Reklam Alanı (AdSense burada görünecek)
</div>

<div class="headline" id="headline">Yükleniyor...</div>

<div class="news" id="news"></div>

<div class="input-box">
    <input id="input" placeholder="Haber sor...">
    <button class="send" onclick="send()">Gönder</button>
</div>

<script>

const API_URL = "https://ai-chatbot-api-bj93.onrender.com/news";

/* saat */
function time(){
    const d = new Date();
    return d.getHours()+":"+String(d.getMinutes()).padStart(2,'0');
}

/* haber ekle */
function addNews(text){

    const parts = text.split("CONTENT:");
    const title = parts[0].replace("TITLE:", "").trim();
    const content = parts[1] || "";

    const div = document.createElement("div");
    div.className="news-item";

    div.innerHTML = `
        <div>
            <b>${title}</b><br>
            <small>${content}</small>
        </div>
        <span class='time'>${time()}</span>
    `;

    document.getElementById("news").prepend(div);
}

/* manşet */
function setHeadline(text){
    document.getElementById("headline").innerText = text;
}

/* API */
async function getNews(query){

    const res = await fetch(API_URL,{
        method:"POST",
        headers:{ "Content-Type":"application/json"},
        body: JSON.stringify({message:query})
    });

    const data = await res.json();

    setHeadline(data.haber);
    addNews(data.haber);
}

async function send(){
    const input = document.getElementById("input");
    const text = input.value;
    if(!text) return;

    input.value="";

    const res = await fetch(API_URL,{
        method:"POST",
        headers:{ "Content-Type":"application/json"},
        body: JSON.stringify({message:text})
    });

    const data = await res.json();

    setHeadline(data.haber);
    addNews(data.haber);
}

/* sayfa açılış */
window.onload = function () {
    getNews("son dakika haberleri");
};

</script>

</body>
</html>
