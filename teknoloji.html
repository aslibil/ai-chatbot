<!DOCTYPE html>
<html>
<head>
<title>Ekonomi Haberleri | PrimeHaber</title>
</head>

<body>

<h1>Ekonomi Haberleri</h1>

<div id="news"></div>

<script>

const API_URL = "https://ai-chatbot-api-bj93.onrender.com/chat";

function addNews(text){
    const div = document.createElement("div");
    div.innerHTML = text;
    document.getElementById("news").prepend(div);
}

async function getNews(){

    const res = await fetch(API_URL,{
        method:"POST",
        headers:{ "Content-Type":"application/json"},
        body: JSON.stringify({message:"son dakika teknoloji haberleri"})
    });

    const data = await res.json();
    addNews(data.cevap);
}

window.onload = getNews;

</script>

</body>
</html>
